<title>Eko Hustle</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap');

  :root {
    --bg: #05070a;
    --card: rgba(20, 26, 24, 0.6);
    --card-hover: rgba(30, 40, 36, 0.8);
    --line: rgba(255, 255, 255, 0.08);
    --text: #ffffff;
    --muted: #8fa39a;
    --green: #22c55e;
    --green-glow: rgba(34, 197, 94, 0.4);
    --amber: #f59e0b;
    --amber-glow: rgba(245, 158, 11, 0.4);
    --red: #ef4444;
    --purple: #a855f7;
    --gold: #fbbf24;
    --blue: #3b82f6;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Outfit', sans-serif; }
  
  body {
    margin: 0; padding: 0; background-color: var(--bg); color: var(--text);
    min-height: 100dvh;
    background-image: 
      radial-gradient(circle at 10% 20%, rgba(34, 197, 94, 0.15) 0%, transparent 40%),
      radial-gradient(circle at 90% 80%, rgba(59, 130, 246, 0.15) 0%, transparent 40%),
      radial-gradient(circle at 50% 50%, rgba(168, 85, 247, 0.05) 0%, transparent 60%);
    background-attachment: fixed;
  }

  #app {
    max-width: 480px; margin: 0 auto; padding: 16px 16px 40px;
    padding-bottom: calc(40px + env(safe-area-inset-bottom));
  }

  h1, h2, h3 { margin: 0; font-weight: 800; letter-spacing: -0.5px; }

  /* --- TOP BAR --- */
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; gap: 8px; }
  .brand { font-weight: 900; font-size: 22px; text-shadow: 0 0 20px rgba(255,255,255,0.2); }
  .brand span { color: var(--green); text-shadow: 0 0 20px var(--green-glow); }
  .topbar-right { display: flex; align-items: center; gap: 6px; }
  .icon-btn {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 8px 10px; font-size: 16px; cursor: pointer; color: var(--text);
    backdrop-filter: blur(10px); position: relative; transition: 0.2s;
  }
  .icon-btn:active { transform: scale(0.92); border-color: var(--green); }
  .badge {
    position: absolute; top: -4px; right: -4px; background: var(--red); color: #fff;
    font-size: 10px; font-weight: 900; border-radius: 999px; padding: 2px 6px; display: none;
    box-shadow: 0 0 10px var(--red);
  }
  .day {
    font-size: 13px; font-weight: 700; color: var(--muted); background: var(--card);
    padding: 8px 12px; border-radius: 12px; border: 1px solid var(--line); backdrop-filter: blur(10px);
  }

  /* --- FEED --- */
  .feed {
    background: rgba(0,0,0,0.4); border: 1px solid var(--line); border-radius: 12px;
    padding: 10px 14px; font-size: 13px; font-weight: 600; color: var(--amber); margin-bottom: 16px;
    display: flex; align-items: center; gap: 10px; overflow: hidden; backdrop-filter: blur(10px);
  }
  .feed-text { white-space: nowrap; animation: slide 15s linear infinite; }
  @keyframes slide { from { transform: translateX(100%); } to { transform: translateX(-100%); } }

  /* --- LEVEL BAR --- */
  .level-bar {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 12px 16px; margin-bottom: 16px; backdrop-filter: blur(10px);
  }
  .level-top { display: flex; justify-content: space-between; font-size: 13px; font-weight: 800; margin-bottom: 8px; }
  .xp-bar { height: 8px; background: rgba(0,0,0,0.5); border-radius: 999px; overflow: hidden; }
  .xp-bar > i { display: block; height: 100%; background: linear-gradient(90deg, #2563eb, #60a5fa); width: 0%; transition: width 0.3s; box-shadow: 0 0 10px rgba(59, 130, 246, 0.5); }

  /* --- STATS --- */
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .stat {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 12px 16px; backdrop-filter: blur(10px); position: relative; overflow: hidden;
  }
  .stat::before {
    content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(135deg, rgba(255,255,255,0.05), transparent); pointer-events: none;
  }
  .stat .k { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
  .stat .v { font-size: 22px; font-weight: 900; margin-top: 4px; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
  .bar { height: 6px; background: rgba(0,0,0,0.5); border-radius: 999px; overflow: hidden; margin-top: 8px; }
  .bar > i { display: block; height: 100%; background: linear-gradient(90deg, #16a34a, #22c55e); width: 0%; transition: width 0.3s; box-shadow: 0 0 10px var(--green-glow); }

  /* --- CHIPS --- */
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .chip {
    background: var(--card); border: 1px solid var(--line); border-radius: 999px;
    padding: 6px 12px; font-size: 12px; font-weight: 600; color: var(--muted); backdrop-filter: blur(10px);
  }
  .chip b { color: var(--text); margin-left: 4px; }

  /* --- LOCATION --- */
  .loc {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 16px; margin-bottom: 16px; backdrop-filter: blur(10px);
    display: flex; flex-direction: column; align-items: flex-start;
    background-image: linear-gradient(to right, rgba(255,255,255,0.02), transparent);
  }
  .loc .name { font-size: 20px; font-weight: 900; }
  .loc .desc { font-size: 13px; font-weight: 500; color: var(--muted); margin-top: 4px; }

  /* --- ACTIONS --- */
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
  button { font-family: 'Outfit', sans-serif; }
  .btn {
    background: var(--card); border: 1px solid var(--line); color: var(--text);
    padding: 16px 12px; border-radius: 16px; font-size: 15px; font-weight: 800; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: all 0.1s; backdrop-filter: blur(10px); position: relative; overflow: hidden;
  }
  .btn:active { transform: scale(0.95); }
  .btn::before {
    content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(135deg, rgba(255,255,255,0.1), transparent); pointer-events: none;
  }
  .btn.primary { background: linear-gradient(135deg, #16a34a, #22c55e); border: none; color: #04140a; box-shadow: 0 4px 20px var(--green-glow); }
  .btn.warn { background: linear-gradient(135deg, #b45309, #f59e0b); border: none; color: #1a0f00; box-shadow: 0 4px 20px var(--amber-glow); }
  .btn.asset { background: linear-gradient(135deg, #1e3a8a, #3b82f6); border: none; color: #eff6ff; box-shadow: 0 4px 20px rgba(59, 130, 246, 0.3); }
  .btn.owambe { background: linear-gradient(135deg, #8b5cf6, #d946ef); border: none; color: #fff; grid-column: span 2; box-shadow: 0 4px 20px rgba(168, 85, 247, 0.4); }
  .btn.vip { background: linear-gradient(135deg, #fbbf24, #d97706); border: none; color: #451a03; grid-column: span 2; box-shadow: 0 4px 20px rgba(245, 158, 11, 0.4); }
  .btn.share { background: linear-gradient(135deg, #25D366, #128C7E); border: none; color: #fff; width: 100%; font-size: 16px; margin-top: 10px; box-shadow: 0 4px 20px rgba(37, 211, 102, 0.3); }
  .btn.invite { background: linear-gradient(135deg, #f59e0b, #d97706); border: none; color: #fff; width: 100%; font-size: 14px; margin-top: 8px; box-shadow: 0 4px 20px var(--amber-glow); }
  .btn.skill { background: linear-gradient(135deg, #2563eb, #3b82f6); border: none; color: #fff; box-shadow: 0 4px 20px rgba(59, 130, 246, 0.3); }

  /* --- SECTION TITLES --- */
  .section-title {
    font-size: 12px; font-weight: 800; color: var(--muted); text-transform: uppercase;
    letter-spacing: 1px; margin: 24px 0 12px;
  }

  /* --- APPOINTMENTS & LOG --- */
  .appt {
    background: linear-gradient(135deg, rgba(20, 26, 24, 0.8), rgba(26, 42, 32, 0.8));
    border: 1px solid rgba(42, 64, 51, 0.8); border-radius: 16px; padding: 16px; margin-bottom: 12px;
    backdrop-filter: blur(10px);
  }
  .appt.ready { border-color: var(--amber); box-shadow: 0 0 20px var(--amber-glow); }
  .appt.missed { opacity: 0.5; border-color: var(--red); }
  .appt .t { font-weight: 800; font-size: 16px; }
  .appt .d { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .appt .meta { font-size: 13px; font-weight: 700; margin-top: 10px; color: var(--amber); }
  .appt .go { margin-top: 12px; }

  .log { font-size: 13px; font-weight: 500; color: var(--muted); line-height: 1.6; }
  .log div { padding: 8px 0; border-bottom: 1px dashed rgba(255,255,255,0.05); }

  /* --- MODALS --- */
  .modal-bg {
    position: fixed; inset: 0; background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(5px);
    display: flex; align-items: flex-end; justify-content: center; z-index: 50; padding: 0;
  }
  .modal {
    background: rgba(15, 20, 18, 0.95); border: 1px solid var(--line);
    border-radius: 24px 24px 0 0; width: 100%; max-width: 480px; padding: 24px 20px;
    max-height: 85vh; overflow: auto; padding-bottom: calc(24px + env(safe-area-inset-bottom));
    backdrop-filter: blur(20px); box-shadow: 0 -10px 40px rgba(0,0,0,0.5);
  }
  .modal h3 { font-size: 20px; margin-bottom: 16px; }
  
  .opt {
    display: block; width: 100%; text-align: left; background: rgba(255,255,255,0.05);
    border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 10px;
    color: var(--text); font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.1s;
  }
  .opt:active { transform: scale(0.98); border-color: var(--green); background: rgba(34, 197, 94, 0.1); }
  .opt .sub { display: block; font-size: 13px; font-weight: 500; color: var(--muted); margin-top: 4px; }
  .opt.locked { opacity: 0.4; pointer-events: none; }

  /* --- LEADERBOARD --- */
  .rank {
    display: flex; align-items: center; gap: 12px; padding: 14px;
    background: rgba(255,255,255,0.03); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 8px;
  }
  .rank.me { border-color: var(--green); box-shadow: 0 0 15px var(--green-glow); background: rgba(34, 197, 94, 0.05); }
  .rank .n { width: 30px; font-weight: 900; color: var(--amber); text-align: center; font-size: 18px; }
  .rank .info { flex: 1; }
  .rank .h { font-weight: 800; font-size: 15px; }
  .rank .m { font-size: 13px; font-weight: 500; color: var(--muted); margin-top: 2px; }

  /* --- ONBOARDING --- */
  .onb { padding-top: 30px; }
  .onb .hero { font-size: 32px; font-weight: 900; line-height: 1.1; margin-bottom: 10px; text-shadow: 0 0 30px rgba(255,255,255,0.1); }
  .onb .hero span { color: var(--green); text-shadow: 0 0 30px var(--green-glow); }
  .onb .sub { color: var(--muted); font-size: 15px; font-weight: 500; margin-bottom: 30px; line-height: 1.4; }
  .field { margin-bottom: 20px; }
  .field label { display: block; font-size: 12px; font-weight: 800; color: var(--muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
  .field input {
    width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--line);
    border-radius: 14px; padding: 16px; color: var(--text); font-size: 16px; font-weight: 600; outline: none; transition: 0.2s;
  }
  .field input:focus { border-color: var(--green); box-shadow: 0 0 15px var(--green-glow); }
  .pick { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .pick .opt { margin: 0; text-align: center; padding: 16px 10px; }
  .pick .opt.sel { border-color: var(--green); background: rgba(34, 197, 94, 0.15); box-shadow: 0 0 15px var(--green-glow); }

  /* --- MISC --- */
  .toast {
    position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%) translateY(20px);
    background: rgba(15, 26, 20, 0.95); border: 1px solid var(--green); color: var(--text);
    padding: 12px 20px; border-radius: 999px; font-size: 14px; font-weight: 700; opacity: 0; transition: 0.3s; z-index: 100;
    max-width: 90vw; text-align: center; pointer-events: none; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .sync { font-size: 11px; font-weight: 700; color: var(--muted); text-align: center; margin-top: 12px; min-height: 16px; letter-spacing: 0.5px; }
  .reset { font-size: 12px; font-weight: 600; color: #5b6b63; text-align: center; margin-top: 30px; background: none; border: none; cursor: pointer; text-decoration: underline; }
  
  .profile-header { text-align: center; margin-bottom: 20px; }
  .profile-name { font-size: 26px; font-weight: 900; }
  .profile-dream { color: var(--amber); font-size: 15px; font-weight: 700; margin-top: 6px; text-transform: uppercase; letter-spacing: 1px; }
  .asset-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  .asset-card { background: rgba(255,255,255,0.05); border: 1px solid var(--line); border-radius: 14px; padding: 16px; text-align: center; }
  .asset-card .emoji { font-size: 28px; }
  .asset-card .name { font-size: 13px; font-weight: 700; margin-top: 6px; }

  .mission {
    display: flex; justify-content: space-between; align-items: center;
    background: rgba(255,255,255,0.03); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 10px;
  }
  .mission.done { border-color: var(--green); background: rgba(34, 197, 94, 0.1); }
  .mission .m-title { font-weight: 700; font-size: 15px; }
  .mission .m-desc { font-size: 13px; font-weight: 500; color: var(--muted); margin-top: 4px; }
  .mission .m-check { font-size: 24px; }

  .skill-row {
    display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
    background: rgba(255,255,255,0.03); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 10px;
  }
  .skill-info { flex: 1; }
  .skill-name { font-weight: 800; font-size: 15px; color: var(--blue); }
  .skill-desc { font-size: 13px; font-weight: 500; color: var(--muted); margin-top: 4px; }
  .skill-lvl { font-size: 18px; font-weight: 900; color: var(--green); margin-right: 12px; }

</style>
</head>

/* ---------------- HELPERS ---------------- */
function load(){try{const r=localStorage.getItem(KEY);return r?JSON.parse(r):null;}catch(e){return null;}}
function clamp(v,lo=0,hi=100){return Math.max(lo,Math.min(hi,v));}
function fmtMoney(n){return Math.max(0,Math.round(n)).toLocaleString("en-NG");}
function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function cleanName(n){return String(n||"").replace(/[\x00-\x1F\x7F]/g,"").trim().slice(0,20);}
function fmtDur(ms){
  if(ms<=0)return"0s";
  const s=Math.floor(ms/1000);
  if(s<60)return s+"s";
  const m=Math.floor(s/60);
  if(m<60)return m+"m "+(s%60)+"s";
  const h=Math.floor(m/60);
  if(h<24)return h+"h "+(m%60)+"m";
  return Math.floor(h/24)+"d "+(h%24)+"h";
}
function toast(msg){
  $toast.textContent=msg;$toast.classList.add("show");
  clearTimeout(toast._t);toast._t=setTimeout(()=>$toast.classList.remove("show"),2200);
}
function addLog(t){S.log.unshift({t:Date.now(),text:t});if(S.log.length>30)S.log.length=30;}
function applyFx(fx){
  if(!fx)return;
  for(const k in fx){
    if(k==="cash")S.cash+=fx[k];
    else if(k==="health")S.health=clamp(S.health+fx[k]);
    else if(k==="happiness")S.happiness=clamp(S.happiness+fx[k]);
    else if(k==="reputation")S.reputation=Math.max(0,S.reputation+fx[k]);
    else if(k==="network")S.network=Math.max(0,S.network+fx[k]);
    else if(k==="energy")S.energy=clamp(S.energy+fx[k],0,S.maxEnergy);
    else if(k==="maxEnergy")S.maxEnergy=Math.max(100, S.maxEnergy+fx[k]);
  }
}

/* ---------------- MISSIONS ---------------- */
function getMissions() {
  const today = new Date().toDateString();
  if (!S.missions || S.missions.date !== today) {
    S.missions = { date: today, work: 0, travel: 0, social: 0, claimed: false };
  }
  return S.missions;
}

function updateMission(type) {
  const m = getMissions();
  if (m.claimed) return;
  if (type === 'work') m.work++;
  if (type === 'travel') m.travel++;
  if (type === 'social') m.social++;
  
  if (m.work >= 3 && m.travel >= 2 && m.social >= 1 && !m.claimed) {
    m.claimed = true;
    S.cash += 5000;
    S.energy = S.maxEnergy;
    addXp(100);
    addLog("🏆 Daily Missions Completed! +₦5,000, Full Energy, +100 XP.");
    toast("🏆 Missions Complete! +₦5,000");
    postToFeed(`${esc(S.name)} completed all daily missions! 🏆`);
  }
  save();
}

function addXp(amount) {
  S.xp = (S.xp || 0) + amount;
  const nextLevelXp = S.level * 100;
  if (S.xp >= nextLevelXp) {
    S.xp -= nextLevelXp;
    S.level++;
    S.skillPoints = (S.skillPoints || 0) + 1;
    toast(`⭐ LEVEL UP! You are now Level ${S.level}! +1 Skill Point.`);
    addLog(`⭐ Leveled up to Level ${S.level}! Got 1 Skill Point.`);
  }
}

/* ---------------- AUTH ---------------- */
async function ensureAuth(){
  if(!sb) return null;
  if(session?.user)return session;
  const { data:{ session:s1 } } = await sb.auth.getSession();
  if(s1?.user){session=s1;return s1;}
  const { data, error } = await sb.auth.signInAnonymously();
  if(error){authError=error.message;return null;}
  session=data.session;
  return session;
}

/* ---------------- SAVE / SYNC ---------------- */
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function save(){
  if(S)S.lastSaved=Date.now();
  saveLocal();
  scheduleCloudSync();
}
function scheduleCloudSync(){
  if(!S||!session?.user||!sb)return;
  clearTimeout(cloudTimer);
  cloudTimer=setTimeout(cloudPush,1500);
}
async function cloudPush(){
  if(!S||!session?.user||!sb)return;
  syncStatus="syncing";
  try{
    const { error } = await sb.from("saves").upsert({
      user_id: session.user.id,
      handle: cleanName(S.name),
      state: S
    }, { onConflict: "user_id" });
    syncStatus = error ? (String(error.message).includes("Too many") ? "ratelimited" : "error") : "synced";
  }catch(e){syncStatus="offline";}
}
async function cloudPull(){
  if(!session?.user||!sb)return null;
  try{
    const { data, error } = await sb.from("saves")
      .select("state,updated_at").eq("user_id", session.user.id).maybeSingle();
    if(error||!data)return null;
    return data;
  }catch(e){return null;}
}

/* ---------------- DAILY RESET ---------------- */
function checkReset(){
  if(!S)return;
  const now=Date.now();
  if(now-S.lastReset>=DAY){
    const days=Math.floor((now-S.lastReset)/DAY);
    S.day+=days;S.lastReset=now;S.energy=S.maxEnergy;
    
    let rentEarned = 0;
    if (S.assets) {
      S.assets.forEach(id => {
        const asset = ASSETS.find(a => a.id === id);
        if (asset && asset.rent) rentEarned += asset.rent * days;
      });
    }
    
    const upkeep=1500*Math.max(0,Math.min(days,Math.max(0,S.day-3-(Math.max(0,S.day-days-3)))));
    
    if (rentEarned > 0) {
      S.cash += rentEarned;
      addLog(`🏠 Collected ₦${fmtMoney(rentEarned)} in rent from your properties.`);
    }
    
    if(upkeep>0){
      if(S.cash>=upkeep){S.cash-=upkeep;addLog(`Day ${S.day}. Upkeep ₦${fmtMoney(upkeep)} paid.`);}
      else{
        const short=upkeep-S.cash;S.cash=0;
        S.health=clamp(S.health-15*days);S.happiness=clamp(S.happiness-15*days);
        addLog(`Day ${S.day}. Couldn't pay ₦${fmtMoney(short)} upkeep.`);
      }
    }else addLog(`Day ${S.day}. Grace period \u2014 no upkeep yet.`);
    save();
  }
}

/* ---------------- APPOINTMENTS ---------------- */
function scheduleAppt(a){S.appointments.push(a);save();}
function checkAppts(){
  if(!S)return false;
  const now=Date.now();let changed=false;
  S.appointments.forEach(a=>{
    if(a.status==="pending"&&now>=a.unlockAt){a.status="ready";changed=true;toast("🔥 Appointment ready: "+a.title);}
    if(a.status==="ready"&&now>a.expiresAt){a.status="missed";applyFx(a.penalty);addLog(`Missed: ${a.title}.`);changed=true;}
  });
  if(changed)save();
  return changed;
}

async function render(){
  await ensureAuth();
  const local=load();
  const cloud=await cloudPull();
  if(cloud?.state){
    const cloudTime=new Date(cloud.updated_at).getTime();
    const localTime=local?(local.lastSaved||local.createdAt||0):0;
    if(cloudTime>localTime){S=cloud.state;saveLocal();}
    else S=local;
  }else S=local;
  if(!S)return renderOnboarding();
  
  if(!S.assets) S.assets = [];
  if(!S.vipUntil) S.vipUntil = 0;
  if(!S.lastOwambe) S.lastOwambe = 0;
  if(!S.missions) S.missions = { date: new Date().toDateString(), work: 0, travel: 0, social: 0, claimed: false };
  if(!S.level) S.level = 1;
  if(!S.xp) S.xp = 0;
  if(!S.skillPoints) S.skillPoints = 0;
  if(!S.skills) S.skills = { hustle: 0, business: 0, charisma: 0 };
  
  checkReset();checkAppts();renderGame();
  
  const today = new Date().toDateString();
  if (S.lastLoginDate !== today) {
    S.lastLoginDate = today;
    S.cash += 1000;
    S.energy = S.maxEnergy;
    save();
    setTimeout(() => {
      openModal(`<h3>☀️ Daily Login Bonus!</h3>

window.openWork=function(){
  const jobs=JOBS[S.location]||[];

    const locked=j.req&&!Object.entries(j.req).every(([k,v])=>S[k]>=v);
    const reqTxt=j.req?Object.entries(j.req).map(([k,v])=>`${v} ${k}`).join(", "):"";
    return `<button class="opt ${locked?"locked":""}" ${locked?"":`onclick="doWork('${j.id}')"`}>
      ${j.emoji} ${j.name}<span class="sub">₦${fmtMoney(j.pay[0])}–₦${fmtMoney(j.pay[1])} • ${j.energy} energy ${locked?`• needs ${reqTxt}`:""}</span></button>`;
  }).join("");
  openModal(`<h3>Work in ${LOCS[S.location].name}</h3>${html||"<p style='color:#8fa39a'>No jobs here.</p>"}<button class="opt" onclick="closeModal()" style="text-align:center;margin-top:16px">Close</button>`);
};

window.doWork=function(jobId){
  const job=(JOBS[S.location]||[]).find(j=>j.id===jobId);
  if(!job)return;
  
  const hustleDiscount = 1 - ((S.skills?.hustle || 0) * 0.05);
  const actualEnergyCost = Math.ceil(job.energy * hustleDiscount);
  
  if(S.energy < actualEnergyCost) return toast(`Not enough energy (needs ${actualEnergyCost}). Rest first.`);
  
  let pay=rand(job.pay[0],job.pay[1]);
  const isVip = S.vipUntil > Date.now();
  const businessMult = 1 + ((S.skills?.business || 0) * 0.10);
  
  if(isVip) pay = pay * 2;
  pay = Math.floor(pay * businessMult);
  
  S.energy -= actualEnergyCost;
  S.cash += pay;
  applyFx(job.fx);
  addXp(job.xp || 10);
  
  S.flags.workCount=(S.flags.workCount||0)+1;
  addLog(`Worked: ${job.name}. +₦${fmtMoney(pay)}${isVip ? " (VIP)" : ""}. +${job.xp||10} XP.`);
  
  updateMission('work');
  
  if(!S.flags.firstGigDone){
    S.flags.firstGigDone=true;
    scheduleAppt({id:"tunde_"+Date.now(),title:"Tunde: Come to Yaba",
      desc:"Tunde says he has a big gig for you. Don't be late.",loc:"yaba",
      unlockAt:Date.now()+90000,expiresAt:Date.now()+90000+DAY,
      reward:{cash:8000,reputation:5,network:3},penalty:{happiness:-10},status:"pending"});
    addLog("📅 New appointment: Tunde in Yaba.");
  }
  if(S.flags.workCount===3&&!S.flags.mysteryScheduled){
    S.flags.mysteryScheduled=true;
    scheduleAppt({id:"mystery_"+Date.now(),title:"Unknown caller",
      desc:"Someone says they have news for you. They'll reach out soon.",loc:S.location,
      unlockAt:Date.now()+4*HOUR,expiresAt:Date.now()+4*HOUR+DAY,
      reward:{cash:rand(2000,6000)},penalty:{happiness:-5},status:"pending"});
    addLog("📞 A mystery caller will reach you soon.");
  }
  save();closeModal();
  if(Math.random()<0.35){renderGame();triggerEvent();}
  else{renderGame();toast(`+₦${fmtMoney(pay)} • +${job.xp||10} XP`);}
};

setInterval(()=>{
  if(!S)return;
  if(checkAppts())renderGame();
  const now=Date.now();
  document.querySelectorAll("[data-cd]").forEach(el=>{
    const a=S.appointments.find(x=>x.id===el.getAttribute("data-cd"));
    if(!a)return;
    if(a.status==="pending")el.textContent=fmtDur(a.unlockAt-now);
    else if(a.status==="ready")el.textContent=fmtDur(a.expiresAt-now);
  });
},1000);

render();

// Register Service Worker for offline support
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW registration failed', err));
  });
}
</script>
</body>
</html>
