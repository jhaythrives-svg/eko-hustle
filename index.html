<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#0b0f0e"/>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏃🏾‍♂️</text></svg>">
<title>Eko Hustle</title>
<style>
  :root{--bg:#0b0f0e;--card:#141a18;--card2:#1b231f;--line:#26302b;
    --text:#e8f0ec;--muted:#8fa39a;--green:#22c55e;--amber:#f59e0b;--red:#ef4444;--purple:#a855f7;--gold:#fbbf24;--blue:#3b82f6;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  body{min-height:100dvh}
  #app{max-width:480px;margin:0 auto;padding:12px 12px 40px;
    padding-bottom:calc(40px + env(safe-area-inset-bottom))}
  h1,h2,h3{margin:0}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
  .brand{font-weight:800;letter-spacing:.5px;font-size:20px;flex-shrink:0}
  .brand span{color:var(--green)}
  .topbar-right{display:flex;align-items:center;gap:6px}
  .icon-btn{background:var(--card);border:1px solid var(--line);border-radius:999px;
    padding:6px 10px;font-size:14px;cursor:pointer;color:var(--text);position:relative}
  .icon-btn:active{border-color:var(--green)}
  .badge{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;
    font-size:9px;font-weight:bold;border-radius:999px;padding:2px 5px;display:none}
  .day{font-size:12px;color:var(--muted);background:var(--card);
    padding:6px 10px;border-radius:999px;border:1px solid var(--line)}
  .level-bar{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:12px}
  .level-top{display:flex;justify-content:space-between;font-size:12px;font-weight:600;margin-bottom:6px}
  .xp-bar{height:6px;background:#0a1f12;border-radius:999px;overflow:hidden}
  .xp-bar > i{display:block;height:100%;background:linear-gradient(90deg,#3b82f6,#60a5fa);width:0%;transition:width .3s}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  .stat .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .stat .v{font-size:18px;font-weight:700;margin-top:2px}
  .bar{height:8px;background:#0a1f12;border-radius:999px;overflow:hidden;margin-top:6px}
  .bar > i{display:block;height:100%;background:linear-gradient(90deg,#16a34a,#22c55e);width:0%;transition:width .3s}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 14px}
  .chip{background:var(--card);border:1px solid var(--line);border-radius:999px;
    padding:6px 10px;font-size:12px;color:var(--muted)}
  .chip b{color:var(--text);margin-left:4px}
  .loc{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:14px;margin-bottom:12px}
  .loc .name{font-size:18px;font-weight:700}
  .loc .desc{font-size:13px;color:var(--muted);margin-top:2px}
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
  button{font-family:inherit}
  .btn{background:var(--card2);border:1px solid var(--line);color:var(--text);
    padding:14px 12px;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:8px;
    transition:transform .05s,border-color .2s}
  .btn:active{transform:scale(.98);border-color:var(--green)}
  .btn.primary{background:linear-gradient(135deg,#16a34a,#22c55e);border:none;color:#04140a}
  .btn.warn{background:linear-gradient(135deg,#b45309,#f59e0b);border:none;color:#1a0f00}
  .btn.asset{background:linear-gradient(135deg,#1e3a8a,#3b82f6);border:none;color:#eff6ff}
  .btn.owambe{background:linear-gradient(135deg,#8b5cf6,#d946ef);border:none;color:#fff;grid-column:span 2;}
  .btn.vip{background:linear-gradient(135deg,#fbbf24,#d97706);border:none;color:#451a03;grid-column:span 2;}
  .btn.share{background:linear-gradient(135deg,#25D366,#128C7E);border:none;color:#fff;width:100%;font-size:16px;margin-top:10px;}
  .btn.invite{background:linear-gradient(135deg,#f59e0b,#d97706);border:none;color:#fff;width:100%;font-size:14px;margin-top:8px;}
  .btn.skill{background:linear-gradient(135deg,#2563eb,#3b82f6);border:none;color:#fff;}
  .section-title{font-size:12px;color:var(--muted);text-transform:uppercase;
    letter-spacing:.8px;margin:18px 0 8px}
  .appt{background:linear-gradient(135deg,#141a18,#1a2a20);border:1px solid #2a4033;
    border-radius:14px;padding:14px;margin-bottom:10px}
  .appt.ready{border-color:var(--amber);box-shadow:0 0 0 1px rgba(245,158,11,.3) inset}
  .appt.missed{opacity:.5;border-color:var(--red)}
  .appt .t{font-weight:700;font-size:15px}
  .appt .d{font-size:13px;color:var(--muted);margin-top:3px}
  .appt .meta{font-size:12px;margin-top:8px;color:var(--amber);font-weight:600}
  .appt .go{margin-top:10px}
  .log{font-size:12px;color:var(--muted);line-height:1.6}
  .log div{padding:4px 0;border-bottom:1px dashed #1e2722}
  .feed{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:10px 12px;font-size:12px;color:var(--amber);margin-bottom:12px;
    display:flex;align-items:center;gap:8px;overflow:hidden}
  .feed-text{white-space:nowrap;animation:slide 15s linear infinite;}
  @keyframes slide { from { transform: translateX(100%); } to { transform: translateX(-100%); } }
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;
    align-items:flex-end;justify-content:center;z-index:50;padding:0}
  .modal{background:var(--card);border:1px solid var(--line);
    border-radius:18px 18px 0 0;width:100%;max-width:480px;padding:18px 16px 24px;
    max-height:85vh;overflow:auto;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
  .modal h3{font-size:16px;margin-bottom:10px}
  .opt{display:block;width:100%;text-align:left;background:var(--card2);
    border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;
    color:var(--text);font-size:14px;cursor:pointer}
  .opt:active{border-color:var(--green)}
  .opt .sub{display:block;font-size:12px;color:var(--muted);margin-top:3px}
  .opt.locked{opacity:.45;pointer-events:none}
  .rank{display:flex;align-items:center;gap:10px;padding:10px 12px;
    background:var(--card2);border:1px solid var(--line);border-radius:12px;margin-bottom:6px}
  .rank .n{width:24px;font-weight:700;color:var(--amber);text-align:center}
  .rank .info{flex:1}
  .rank .h{font-weight:600}
  .rank .m{font-size:12px;color:var(--muted);margin-top:2px}
  .rank.me{border-color:var(--green)}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);
    background:#0f1a14;border:1px solid #2a4033;color:var(--text);padding:10px 14px;
    border-radius:12px;font-size:13px;opacity:0;transition:.25s;z-index:100;
    max-width:90vw;text-align:center;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .onb{padding-top:20px}
  .onb .hero{font-size:26px;font-weight:800;line-height:1.15;margin-bottom:6px}
  .onb .hero span{color:var(--green)}
  .onb .sub{color:var(--muted);font-size:14px;margin-bottom:20px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;
    text-transform:uppercase;letter-spacing:.6px}
  .field input{width:100%;background:var(--card);border:1px solid var(--line);
    border-radius:12px;padding:14px;color:var(--text);font-size:16px;outline:none}
  .field input:focus{border-color:var(--green)}
  .pick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .pick .opt{margin:0;text-align:center;padding:14px 10px}
  .pick .opt.sel{border-color:var(--green);background:#0f2016}
  .reset{font-size:11px;color:#5b6b63;text-align:center;margin-top:24px;
    background:none;border:none;cursor:pointer;text-decoration:underline}
  .sync{font-size:10px;color:var(--muted);text-align:center;margin-top:8px;min-height:14px}
  .legal{font-size:11px;color:#6b7c73;text-align:center;margin-top:12px;line-height:1.5}
  .legal a{color:var(--green);text-decoration:none}
  .code-box{background:#0b0f0e;border:1px solid #26302b;border-radius:10px;padding:12px;
    font-family:monospace;font-size:14px;word-break:break-all;margin-bottom:12px;text-align:center;letter-spacing:2px}
  .profile-header{text-align:center;margin-bottom:16px}
  .profile-name{font-size:24px;font-weight:800}
  .profile-dream{color:var(--amber);font-size:14px;font-weight:600;margin-top:4px}
  .asset-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
  .asset-card{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
  .asset-card .emoji{font-size:24px}
  .asset-card .name{font-size:12px;font-weight:600;margin-top:4px}
  .mission{display:flex;justify-content:space-between;align-items:center;
    background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
  .mission.done{border-color:var(--green);background:#0f2016}
  .mission .m-title{font-weight:600;font-size:14px}
  .mission .m-desc{font-size:12px;color:var(--muted);margin-top:2px}
  .mission .m-check{font-size:20px}
  .skill-row{display:flex;justify-content:space-between;align-items:center;
    background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
  .skill-info{flex:1}
  .skill-name{font-weight:700;font-size:14px;color:var(--blue)}
  .skill-desc{font-size:12px;color:var(--muted);margin-top:2px}
  .skill-lvl{font-size:16px;font-weight:800;color:var(--green);margin-right:12px}

  .float{position:fixed;top:40%;font-weight:800;font-size:22px;pointer-events:none;z-index:120;animation:fl 1.1s ease-out forwards;text-shadow:0 2px 8px #000}
  @keyframes fl{to{transform:translateY(-90px);opacity:0}}
  .conf{position:fixed;font-style:normal;font-size:20px;pointer-events:none;z-index:120;animation:cf 1.3s ease-out forwards}
  @keyframes cf{to{transform:translate(var(--x),var(--y)) rotate(360deg);opacity:0}}
  .rival{background:var(--card);border:1px solid #4a2a2a;border-radius:12px;padding:10px 12px;margin-bottom:12px}
  .rv-top{display:flex;justify-content:space-between;font-size:13px}
  .rv-sub{font-size:11px;color:var(--muted);margin-top:6px}
  .sgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:10px 0}
  .sd{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:6px 2px;font-size:10px;text-align:center;color:var(--muted)}
  .sd b{display:block;color:var(--text);font-size:10px;margin-top:2px}
  .sd.got{opacity:.5;border-color:var(--green)}
  .sd.now{border-color:var(--gold);background:#2a2010;animation:pl 1s infinite alternate}
  @keyframes pl{to{box-shadow:0 0 12px var(--gold)}}
  .rw{text-align:center;font-size:13px;color:#c8d6ce;margin:8px 0}
  .spin{font-size:26px;font-weight:800;text-align:center;padding:28px 8px;background:var(--card2);border:2px dashed var(--line);border-radius:14px;margin:12px 0}
  .spin.win{border-color:var(--gold);color:var(--gold);animation:pl .5s 3 alternate}
  .pulse{animation:pl .8s infinite alternate}

  /* VISUAL NOVEL ELEMENTS */
  .visual-area {
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    height: 200px; margin-top: 10px; margin-bottom: 10px; position: relative;
  }
  .character-img {
    max-height: 180px; max-width: 100%; object-fit: contain;
    animation: fadeIn 0.4s ease-out; z-index: 1;
  }
  .dialogue-box {
    background: rgba(0, 0, 0, 0.85); border: 1px solid var(--line); border-left: 4px solid var(--green);
    border-radius: 8px; padding: 12px; width: 100%; min-height: 60px;
    z-index: 2; margin-top: -10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
  }
  .dialogue-name {
    color: var(--green); font-size: 11px; font-weight: 800; text-transform: uppercase;
    letter-spacing: 1px; margin-bottom: 4px; display: block;
  }
  .dialogue-text {
    font-size: 14px; font-weight: 600; line-height: 1.4; color: #fff;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .char-em{font-size:84px;line-height:1;z-index:1;animation:bob 3s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-5px)}}
  .tbar{position:relative;height:34px;background:var(--card2);border:1px solid var(--line);border-radius:999px;margin:14px 0;overflow:hidden}
  .tz{position:absolute;left:33%;width:34%;top:0;bottom:0;background:rgba(34,197,94,.28)}
  .tz:after{content:"";position:absolute;left:29.4%;width:41%;top:0;bottom:0;background:rgba(251,191,36,.6)}
  .tm{position:absolute;top:0;bottom:0;width:6px;background:#fff;border-radius:3px;transform:translateX(-50%)}
  /* V4 ANIMATED SCENE */
  .scene{position:relative;height:190px;border-radius:14px;overflow:hidden;border:1px solid var(--line);margin-bottom:6px;transition:background 1s}
  .scene.rainy{filter:brightness(.78) saturate(.85)}
  .celest{position:absolute;font-size:30px;z-index:1;animation:bob 4s ease-in-out infinite}
  .star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;animation:tw 2s ease-in-out infinite alternate}
  @keyframes tw{to{opacity:.2}}
  .sk{position:absolute;left:0;width:200%;display:flex;z-index:2;animation:scr 70s linear infinite}
  .sk svg{width:50%;height:auto;display:block}
  .sk1{bottom:44px;opacity:.9}.sk2{bottom:38px;z-index:3;animation-duration:32s}
  @keyframes scr{to{transform:translateX(-50%)}}
  .ground{position:absolute;left:0;right:0;bottom:0;height:50px;background:linear-gradient(#3a3f44,#1a1d20);z-index:4}
  .ground:after{content:"";position:absolute;left:0;right:0;bottom:12px;height:3px;background:repeating-linear-gradient(90deg,#f5d76e 0 22px,transparent 22px 48px);background-size:48px 3px;animation:lane 1s linear infinite;opacity:.7}
  @keyframes lane{to{background-position:-48px 0}}
  .veh{position:absolute;font-size:34px;z-index:4;white-space:nowrap}
  @keyframes drive{from{left:-15%}to{left:110%}}
  @keyframes driveL{from{left:110%}to{left:-15%}}
  .prop{position:absolute;left:46%;bottom:44px;font-size:40px;z-index:3;filter:drop-shadow(0 2px 4px #000)}
  .av{position:absolute;left:14%;bottom:20px;z-index:6;animation:bob 2.4s ease-in-out infinite}
  .av img{height:96px;display:block}.av b{font-size:72px;line-height:1;display:block}
  .npc{position:absolute;left:66%;bottom:20px;z-index:5}
  .npc img{height:96px;display:block}.npc b{font-size:72px;line-height:1;display:block}
  .bubble{position:absolute;top:-20px;left:50%;transform:translateX(-50%);background:#fff;color:#000;border-radius:10px;padding:0 7px;font-size:14px;z-index:7;animation:bob 1s ease-in-out infinite}
  .locname{position:absolute;left:10px;top:8px;z-index:8;background:rgba(0,0,0,.5);padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700}
  .rain{position:absolute;inset:0;z-index:7;opacity:.5;pointer-events:none;background:repeating-linear-gradient(105deg,rgba(255,255,255,.5) 0 1px,transparent 1px 10px);background-size:20px 40px;animation:rn .35s linear infinite}
  @keyframes rn{to{background-position:-20px 40px}}
  .scene.work .av{animation:wk .35s ease-in-out 4}
  @keyframes wk{0%,100%{transform:rotate(0)}30%{transform:rotate(-10deg) translateY(-8px)}70%{transform:rotate(8deg) translateY(-3px)}}
  .scene.arrive .av{animation:runin 1s ease-out}
  @keyframes runin{from{transform:translateX(-170px) skewX(-10deg)}to{transform:none}}
  .scene.arrive .sk{animation-duration:2.5s}
  .coin{position:absolute;bottom:110px;font-style:normal;font-size:22px;z-index:9;animation:cn 1.1s ease-out both}
  @keyframes cn{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-80px) rotate(45deg)}}
  .visual-area{height:auto;flex-direction:row;align-items:center;gap:10px;margin:8px 0}
  .character-img{max-height:64px;width:64px;border-radius:50%;border:2px solid var(--line);object-fit:cover}
  .char-em{font-size:44px;animation:none}
  .dialogue-box{margin-top:0}
  /* V5 ONE-SCREEN MOBILE SHELL */
  body{-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation;overscroll-behavior:none}
  body.in-game,body.in-game html{overflow:hidden;height:100dvh}
  body.in-game #app{height:100dvh;max-height:100dvh;display:flex;flex-direction:column;gap:6px;padding:max(8px,env(safe-area-inset-top)) 10px max(8px,env(safe-area-inset-bottom));overflow:hidden}
  body.in-game #app>*{flex-shrink:0;margin-bottom:0}
  body.in-game .topbar{margin:0}
  body.in-game .brand{font-size:17px}
  body.in-game .icon-btn{width:34px;height:34px;font-size:15px}
  body.in-game .day small{opacity:.7}
  body.in-game .feed{padding:3px 8px;font-size:11px}
  body.in-game .scene{flex:1 1 0;min-height:110px;height:auto;margin:0;flex-shrink:1}
  body.in-game .av img,body.in-game .npc img{height:clamp(54px,15vh,104px)}
  body.in-game .av b,body.in-game .npc b{font-size:clamp(44px,11vh,76px)}
  body.in-game .visual-area{margin:0;gap:8px}
  body.in-game .character-img{max-height:38px;width:38px}
  body.in-game .char-em{font-size:30px}
  body.in-game .dialogue-box{padding:5px 9px}
  body.in-game .dialogue-text{font-size:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .hud{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:7px 9px}
  .hud-top{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700}
  .hud-top .xp-bar{flex:1;margin:0}.lv{color:var(--blue)}
  .mini{background:#2a2010;border:1px solid var(--gold);color:var(--gold);border-radius:8px;font-size:11px;padding:1px 6px}
  .hud-row{display:flex;align-items:center;gap:10px;margin:5px 0 3px}
  .cash{font-size:19px;font-weight:800;color:var(--green);white-space:nowrap}
  .en{flex:1;font-size:10px;color:var(--muted)}.en .bar{margin-bottom:2px}
  .hud-chips{display:flex;justify-content:space-between;font-size:11px;color:#c8d6ce}
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .cards .rival{padding:6px 8px;margin:0;min-width:0}
  .cards .rv-top,.cards .rv-sub{font-size:10px}
  .cards .rv-sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
  .cards .rival>div:nth-child(2){font-size:11px!important;margin:2px 0 4px!important;line-height:1.2}
  .dk1{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:6px}
  .dk1 .btn{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 2px;font-size:20px;line-height:1.1;min-height:52px}
  .dk1 .btn span{font-size:11px;font-weight:700}
  .dk2{display:flex;gap:5px;margin-top:6px}
  .dk2 button{flex:1;background:var(--card);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:4px 0;font-size:17px;display:flex;flex-direction:column;align-items:center;min-height:42px}
  .dk2 span{font-size:9px;color:var(--muted)}
  @media (max-height:640px){body.in-game .feed{display:none}}
  @media (max-height:580px){.cards{display:none}}
  @media (max-height:520px){.hud-chips{display:none}}
  /* V7 MATURE LOOK + FOREX TERMINAL */
  :root{--bg:#070a0c;--card:#0f1519;--card2:#151d22;--line:#1e2a30;--green:#2fbf86;--gold:#e9b949;--red:#ef5b69;--amber:#e9a23b}
  .scene{border-radius:12px;border-color:#18232a}
  .orb{position:absolute;width:30px;height:30px;border-radius:50%;z-index:1;background:radial-gradient(circle,#fff4d6 0 38%,rgba(255,214,140,.4) 60%,transparent 72%)}
  .orb.moon{background:radial-gradient(circle at 35% 35%,#f4f1e6 0 60%,#aeb9c6 100%);box-shadow:0 0 28px rgba(170,200,255,.35);width:22px;height:22px}

  if(s<60)return s+"s";
  const m=Math.floor(s/60);
  if(m<60)return m+"m "+(s%60)+"s";
  const h=Math.floor(m/60);
  if(h<24)return h+"h "+(m%60)+"m";
  return Math.floor(h/24)+"d "+(h%24)+"h";
}

/* ---------------- MISSIONS ---------------- */
function getMissions() {
  const today = new Date().toDateString();
  if (!S.missions || S.missions.date !== today) {
    S.missions = { date: today, work: 0, travel: 0, social: 0, claimed: false };
  }
  return S.missions;
}

function updateMission(type) {
  const m = getMissions();
  if (m.claimed) return;
  if (type === 'work') m.work++;
  if (type === 'travel') m.travel++;
  if (type === 'social') m.social++;
  
  if (m.work >= 3 && m.travel >= 2 && m.social >= 1 && !m.claimed) {
    m.claimed = true;
    S.cash += 5000;
    S.energy = S.maxEnergy;
    addXp(100); // Bonus XP for completing all missions
    addLog("🏆 Daily Missions Completed! +₦5,000, Full Energy, +100 XP.");

    showCharacter('avatar', "You crushed all your missions today! Lagos is yours.", 5000);
  }
  save();
}

async function ensureAuth(){
  if(!sb) return null;
  if(session?.user)return session;
  const { data:{ session:s1 } } = await sb.auth.getSession();
  if(s1?.user){session=s1;return s1;}

async function cloudPush(){
  if(!S||!session?.user||!sb)return;
  syncStatus="syncing";
  try{
    const { error } = await sb.from("saves").upsert({
      user_id: session.user.id,
      handle: cleanName(S.name),
      state: S
    }, { onConflict: "user_id" });
    syncStatus = error ? (String(error.message).includes("Too many") ? "ratelimited" : "error") : "synced";
  }catch(e){syncStatus="offline";}
}
async function cloudPull(){
  if(!session?.user||!sb)return null;
  try{
    const { data, error } = await sb.from("saves")
      .select("state,updated_at").eq("user_id", session.user.id).maybeSingle();
    if(error||!data)return null;
    return data;
  }catch(e){return null;}
}

/* ---------------- DAILY RESET ---------------- */
function checkReset(){
  if(!S)return;
  const now=Date.now();
  if(now-S.lastReset>=DAY){
    const days=Math.floor((now-S.lastReset)/DAY);
    S.day+=days;S.lastReset=now;S.energy=S.maxEnergy;ffDaily(days);
    
    let rentEarned = 0;
    if (S.assets) {
      S.assets.forEach(id => {
        const asset = ASSETS.find(a => a.id === id);
        if (asset && asset.rent) rentEarned += asset.rent * days;
      });
    }
    
    const upkeep=dailyCost()*Math.max(0,Math.min(days,Math.max(0,S.day-3-(Math.max(0,S.day-days-3)))));
    
    if (rentEarned > 0) {
      S.cash += rentEarned;
      addLog(`🏠 Collected ₦${fmtMoney(rentEarned)} in rent from your properties.`);
    }
    
    if(upkeep>0){
      if(S.cash>=upkeep){S.cash-=upkeep;addLog(`Day ${S.day}. Upkeep ₦${fmtMoney(upkeep)} paid.`);}
      else{
        const short=upkeep-S.cash;S.cash=0;
        S.health=clamp(S.health-15*days);S.happiness=clamp(S.happiness-15*days);
        addLog(`Day ${S.day}. Couldn't pay ₦${fmtMoney(short)} upkeep.`);
      }
    }else addLog(`Day ${S.day}. Grace period \u2014 no upkeep yet.`);
    save();
  }
}

  if(fresh){const y=new Date(now-DAY).toDateString();

    S.lastLoginDate=today;bonus=STREAK[(S.streak-1)%7];S.energy=S.maxEnergy;
    if(S.streak%7===0){S.shield=(S.shield||0)+1;S.skillPoints=(S.skillPoints||0)+1;}
  }else if(idle)S.energy=Math.min(S.maxEnergy,S.energy+Math.floor(away/30000));

async function fxCall(fn,args){if(!sb||!session||!session.user){toast("Trading needs an online connection");return null;}const{data,error}=await sb.rpc(fn,args||{});if(error){toast(String(error.message).slice(0,90));return null;}FXS.d=data;fxHandle(data);return data;}

function fxHandle(d){(d.closed||[]).forEach(c=>{const pl=Number(c.pnl);addLog(`📊 ${FXN[c.pair]} ${c.side==="buy"?"LONG":"SHORT"} ${c.reason}: ${pl>=0?"+":"-"}₦${fmtMoney(Math.abs(pl))}`);toast(`${FXN[c.pair]} ${c.reason}: ${pl>=0?"+":"-"}₦${fmtMoney(Math.abs(pl))}`);addXp(Math.min(60,Math.max(5,Math.round(Math.abs(pl)/1000))));if(pl>0){burst();sfx(3);if(pl>=50000)postToFeed(`${esc(S.name)} banked ₦${fmtMoney(pl)} on ${FXN[c.pair]} 📈`);}else if(c.reason==="liquidated"){buzz([80,40,80]);showCharacter('chinedu',"Margin call. Leverage does not forgive.",6000);}});if((d.closed||[]).length)save();}

function fxDraw(){const cv=document.getElementById("fxc");if(!cv||!FXS.d)return;const cs=FXS.d.pairs[FXS.p].candles.map(a=>({o:a[0],h:a[1],l:a[2],c:a[3]}));if(!cs.length)return;const dpr=window.devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;if(cv.width!==Math.round(w*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);}const g=cv.getContext("2d");g.setTransform(dpr,0,0,dpr,0,0);g.fillStyle="#090e11";g.fillRect(0,0,w,h);
  const hi=Math.max(...cs.map(c=>c.h)),lo=Math.min(...cs.map(c=>c.l)),pad=(hi-lo)*.1||1,H=hi+pad,Lw=lo-pad,Y=v=>h-14-(v-Lw)/(H-Lw)*(h-26),bw=(w-54)/cs.length;
  g.font="10px ui-monospace,monospace";g.lineWidth=1;for(let q=0;q<5;q++){const v=Lw+(H-Lw)*q/4,y=Y(v);g.strokeStyle="rgba(255,255,255,.06)";g.beginPath();g.moveTo(0,y);g.lineTo(w-50,y);g.stroke();g.fillStyle="#5d6e78";g.fillText(v.toFixed(2),w-48,y+3);}
  cs.forEach((c,q)=>{const x=q*bw+bw/2,col=c.c>=c.o?"#26e07f":"#ff4d5e";g.strokeStyle=g.fillStyle=col;g.beginPath();g.moveTo(x,Y(c.h));g.lineTo(x,Y(c.l));g.stroke();const y1=Y(Math.max(c.o,c.c)),y2=Y(Math.min(c.o,c.c));g.fillRect(x-bw*.32,y1,bw*.64,Math.max(1.5,y2-y1));});
  const lc=cs[cs.length-1],yl=Y(lc.c),col=lc.c>=lc.o?"#26e07f":"#ff4d5e";g.setLineDash([4,3]);g.strokeStyle="rgba(255,255,255,.45)";g.beginPath();g.moveTo(0,yl);g.lineTo(w-50,yl);g.stroke();g.setLineDash([]);g.fillStyle=col;g.fillRect(w-52,yl-8,52,16);g.fillStyle="#03100a";g.fillText(lc.c.toFixed(2),w-49,yl+3);
  (FXS.d.positions||[]).filter(po=>po.pair===FXS.p).forEach(po=>{const y=Y(po.entry);g.strokeStyle="#e9b949";g.setLineDash([2,3]);g.beginPath();g.moveTo(0,y);g.lineTo(w-50,y);g.stroke();g.setLineDash([]);g.fillStyle="#e9b949";g.fillText((po.side==="buy"?"▲ LONG":"▼ SHORT")+" entry",4,y-3);});}
function fxPaint(){const hd=document.getElementById("fxhead");if(!hd)return;document.querySelectorAll("[data-fx]").forEach(b=>{const[k,v]=b.dataset.fx.split(":");b.classList.toggle("on",String(FXS[k])===v);});const d=FXS.d;if(!d){hd.innerHTML='<div class="fxsub">Connecting to the market…</div>';return;}const tot=Number(d.balance)+(d.positions||[]).reduce((t,p)=>t+Number(p.stake),0);document.querySelectorAll('[data-fx^="stake:"]').forEach(b=>b.classList.toggle("lck",Number(b.dataset.fx.split(":")[1])>tot*.25));

  (d.positions||[]).forEach(po=>{const e=document.getElementById("pl"+po.id);if(e){const pl=Number(po.pnl);e.className=pl>=0?"up":"dn";e.textContent=(pl>=0?"+":"-")+"₦"+fmtMoney(Math.abs(pl));}});}

const LIFE=[{n:"Modest",c:0,h:0},{n:"Comfortable",c:1200,h:2},{n:"Flashy",c:3500,h:5},{n:"Luxury",c:9000,h:9}];

const dailyCost=()=>1500+LIFE[(S&&S.life)||0].c;

function rentDay(){return(S.assets||[]).reduce((t,id)=>t+((ASSETS.find(a=>a.id===id)||{}).rent||0),0);}

function eduMult(){return 1+COURSES.reduce((t,c)=>t+((S.edu||{})[c.id]?c.b:0),0);}

function ax(){try{if(!AX){AX=new(window.AudioContext||window.webkitAudioContext)();MG=AX.createGain();MG.gain.value=1;MG.connect(AX.destination);}if(AX.state==="suspended")AX.resume();return AX;}catch(e){return null;}}
function tn(f,t,d,ty,v,f2){const a=ax();if(!a)return;const o=a.createOscillator(),g=a.createGain(),T=a.currentTime+t;o.type=ty||"sine";o.frequency.setValueAtTime(f,T);if(f2)o.frequency.exponentialRampToValueAtTime(f2,T+d);g.gain.setValueAtTime(v||.1,T);g.gain.exponentialRampToValueAtTime(.0008,T+d);o.connect(g);g.connect(MG);o.start(T);o.stop(T+d+.02);}
function nz(t,d,v,fq,ty){const a=ax();if(!a)return;const n=Math.floor(a.sampleRate*d),b=a.createBuffer(1,n,a.sampleRate),c=b.getChannelData(0);for(let i=0;i<n;i++)c[i]=Math.random()*2-1;const s0=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain(),T=a.currentTime+t;s0.buffer=b;f.type=ty||"bandpass";f.frequency.value=fq;g.gain.setValueAtTime(v,T);g.gain.exponentialRampToValueAtTime(.0008,T+d);s0.connect(f);f.connect(g);g.connect(MG);s0.start(T);}

    const foreign=local&&local.uid&&session&&session.user&&local.uid!==session.user.id,forced=localStorage.getItem("eh_recover")==="1"&&session&&session.user&&!session.user.is_anonymous;

async function fetchFeed() {
  const $feedText = document.getElementById("feed-text");
  if(!$feedText || !sb) return;
  try {
    const { data } = await sb.from('public_events').select('message').order('created_at', {ascending: false}).limit(5);
    if (data && data.length > 0) {
      const messages = data.map(d => d.message).join('  •  ');
      $feedText.textContent = messages;
    } else {
      $feedText.textContent = "Quiet in Lagos today... Start a hustle to make news!";
    }
  } catch(e) {}
}

async function postToFeed(msg) {
  if(!sb || !session?.user) return;
  try { await sb.from('public_events').insert({ message: msg }); } catch(e) {}
}

function apptCard(a,now){

    <div class="meta">${meta}</div>

window.doWorkCore=function(jobId){
  const job=(JOBS[S.location]||[]).find(j=>j.id===jobId);
  if(!job)return;
  
  const hustleDiscount = 1 - ((S.skills?.hustle || 0) * 0.05);

  if(S.energy < actualEnergyCost) return toast(`Not enough energy (needs ${actualEnergyCost}). Rest first.`);
  
  let pay=rand(job.pay[0],job.pay[1]);const cb=hustleCombo();pay=Math.floor(pay*cb*(window._perf||1));pay=Math.floor(pay*eduMult());window._perf=1;
  const isVip = vipOn();
  const businessMult = 1 + ((S.skills?.business || 0) * 0.10);
  
  if(isVip) pay = pay * 2;
  pay = Math.floor(pay * businessMult);
  
  S.energy -= actualEnergyCost;
  S.cash += pay;floatText("+₦"+fmtMoney(pay));sfx(1);buzz(15);
  applyFx(job.fx);
  addXp(job.xp || 10);
  
  S.flags.workCount=(S.flags.workCount||0)+1;if(S.flags.workCount===1)track('first_job');
  addLog(`Worked: ${job.name}. +₦${fmtMoney(pay)}${isVip ? " (VIP)" : ""}. +${job.xp||10} XP.`);
  
  updateMission('work');
  
  if(!S.flags.firstGigDone){
    S.flags.firstGigDone=true;
    scheduleAppt({id:"tunde_"+Date.now(),title:"Tunde: Come to Yaba",
      desc:"Tunde says he has a big gig for you. Don't be late.",loc:"yaba",
      unlockAt:Date.now()+90000,expiresAt:Date.now()+90000+DAY,

    addLog("📅 New appointment: Tunde in Yaba.");
    showCharacter('tunde', "Guy! You get mind. Come to Yaba tomorrow, I get a big gig for you. Don't be late.", 6000);
  }
  if(S.flags.workCount===3&&!S.flags.mysteryScheduled){
    S.flags.mysteryScheduled=true;
    scheduleAppt({id:"mystery_"+Date.now(),title:"Unknown caller",
      desc:"Someone says they have news for you. They'll reach out soon.",loc:S.location,
      unlockAt:Date.now()+4*HOUR,expiresAt:Date.now()+4*HOUR+DAY,
      reward:{cash:rand(2000,6000)},penalty:{happiness:-5},status:"pending"});
    addLog("📞 A mystery caller will reach you soon.");
  }
  save();closeModal();

};

window.doAjo=function(){
  const today=new Date().toDateString();
  if(S.ajo.lastPaid===today)return toast("Ajo already paid today.");
  if(S.cash<500)return toast("Ajo is ₦500.");
  S.cash-=500;S.ajo.total+=500;S.ajo.streak+=1;S.ajo.lastPaid=today;
  addLog(`Ajo paid. Streak: ${S.ajo.streak}.`);
  
  updateMission('social');
  
  if(S.ajo.streak%7===0){
    const p=5000;S.cash+=p;S.ajo.payouts+=1;
    addXp(50);
    addLog(`🎉 Ajo payout! +₦${fmtMoney(p)}. +50 XP.`);toast(`Ajo payout: ₦${fmtMoney(p)}!`);
    postToFeed(`${esc(S.name)} just won a ₦5,000 Ajo payout! 🪙`);
  }
  else toast(`Ajo paid. Streak ${S.ajo.streak}/7`);
  save();renderGame();
};

window.claimAppt=function(id){
  const a=S.appointments.find(x=>x.id===id);if(!a)return;
  if(a.status!=="ready")return toast("Not ready yet.");
  if(S.location!==a.loc)return toast(`Go to ${LOCS[a.loc].name}.`);
  applyFx(a.reward);a.status="done";
  addXp(25);
  const parts=[];
  if(a.reward.cash)parts.push(`+₦${fmtMoney(a.reward.cash)}`);
  if(a.reward.reputation)parts.push(`+${a.reward.reputation} rep`);
  if(a.reward.network)parts.push(`+${a.reward.network} net`);
  addLog(`✅ Claimed: ${a.title}. ${parts.join(", ")}. +25 XP.`);
  toast(parts.join(" · ")||"Claimed.");save();renderGame();
  if(a.id.startsWith("tunde")) showCharacter('tunde', "You showed up! I like that. Here is your cut. Let's do more business.", 5000);
  if(a.id.startsWith("chief")) showCharacter('chief', "Excellent! You are sharp. Here is your reward.", 5000);
};

/* ---------------- LEADERBOARD ---------------- */
window.openLeaderboard=async function(){
  if(!sb)return toast("Cloud not configured. Play locally.");
  openModal(`<h3>🏆 Leaderboard</h3><div style="color:#8fa39a;font-size:13px">Loading…</div>`);
  if(!session?.user){openModal(`<h3>🏆 Leaderboard</h3><div style="color:#8fa39a;font-size:13px">Sign-in required. Reload the page.</div><button class="opt" onclick="closeModal()">Close</button>`);return;}
  const { data, error } = await sb.rpc("get_leaderboard");
  if(error||!data?.length){openModal(`<h3>🏆 Leaderboard</h3><div style="color:#8fa39a;font-size:13px">No ranked players yet.</div><button class="opt" onclick="closeModal()">Close</button>`);return;}
  const html=data.map((r,i)=>`<div class="rank${r.is_me?" me":""}">
    <div class="n">${i+1}</div><div class="info">
      <div class="h">${esc(r.handle)}${r.is_me?" (you)":""}</div>
      <div class="m">Day ${r.day} · ⭐ ${r.reputation} · 💰 Score ₦${fmtMoney(r.cash)}</div>
    </div></div>`).join("");
  openModal(`<h3>🏆 Top Hustlers</h3>${html}<button class="opt" onclick="closeModal()">Close</button>`);
};

/* ---------------- SETTINGS + PRIVACY ---------------- */
window.openSettings=function(){
  openModal(`<h3>⚙️ Settings</h3>
    <button class="opt" onclick="S.mute=!S.mute;save();ambUpdate();openSettings()">${S.mute?"🔇 Sound: Off":"🔊 Sound: On"}</button>
    <button class="opt" onclick="S.amb=S.amb===false;save();ambUpdate();openSettings()">${S.amb===false?"🌆 City ambience: Off":"🌆 City ambience: On"}</button>
    <button class="opt" onclick="S.vo=S.vo===false;save();openSettings()">${S.vo===false?"🗣️ Voices: Off":"🗣️ Voices: On"}</button>
    <button class="opt" onclick="S.look=S.look==='f'?'m':'f';save();renderGame();openSettings()">🎭 Switch look (${S.look==='f'?'Female':'Male'})</button>
    <button class="opt" onclick="openRecover()">${accEmail()?"☁️ Progress saved to your email ✅":"☁️ Save my progress ⚠️"}</button>
    <button class="opt" onclick="previewTime()">🌅 Preview day &amp; night</button>
    <button class="opt" onclick="showPrivacy()">Privacy notice</button>
    <button class="opt" onclick="deleteMyData()" style="color:#fca5a5">Delete all my data</button>
    <button class="opt" onclick="closeModal()">Close</button>`);
};
window.showPrivacy=function(){
  openModal(`<h3>Privacy</h3>
    <div style="color:#c8d6ce;font-size:13px;line-height:1.6">
      <p><b>What we store:</b> an anonymous account (random ID), the display name you type, and your game save.</p>
      <p><b>What we never collect:</b> real name, email, phone, location, contacts, photos.</p>
      <p><b>Where:</b> Supabase (Postgres, EU/US). Encrypted in transit.</p>
      <p><b>Who can see it:</b> only you. Leaderboard shows display name, cash, reputation, day. No IDs.</p>
      <p><b>Delete:</b> Settings → Delete all my data. Immediate and permanent.</p>
      <p><b>Retention:</b> inactive saves over 90 days are deleted.</p>
      <p style="color:#8fa39a;font-size:12px;margin-top:12px">NDPR-aligned. Questions: reply on our WhatsApp Channel.</p>
    </div>
    <button class="opt" onclick="closeModal()">Close</button>`);
};
window.deleteMyData=async function(){
  if(!session?.user||!sb)return;
  if(!confirm("Delete your save and account? This cannot be undone."))return;
  try{
    await sb.from("subscriptions").delete().eq("user_id", session.user.id);
    await sb.from("link_tokens").delete().eq("user_id", session.user.id);
    await sb.from("saves").delete().eq("user_id", session.user.id);
    await sb.auth.signOut();
  }catch(e){}
  localStorage.removeItem(KEY);
  S=null;session=null;closeModal();
  toast("Data deleted.");
  location.reload();
};

/* ---------------- EVENTS ---------------- */
function triggerEvent(){
  renderGame();
  const ev=EVENTS[Math.floor(Math.random()*EVENTS.length)];
  currentEvent=ev;
  const html=ev.choices.map((c,i)=>`<button class="opt" onclick="pickChoice(${i})">${esc(c.label)}</button>`).join("");
  showCharacter('avatar', ev.text, 0);
  openModal(`<h3>${esc(ev.title)}</h3><p style="color:#c8d6ce;font-size:14px;margin:0 0 12px">${esc(ev.text)}</p>${html}`);
}

window.pickChoice=function(i){
  if(!currentEvent)return;
  const c=currentEvent.choices[i];
  applyFx(c.fx);
  if(c.tag==="mystery"){
    const win=Math.random()<0.5;
    scheduleAppt({id:"myst_"+Date.now(),
      title: win?"🎲 Your gamble paid off":"🎲 Your gamble failed",
      desc: win?"The bet landed. Come collect.":"The bet didn't land. Lesson learned.",
      loc:S.location,unlockAt:Date.now()+60000,expiresAt:Date.now()+DAY,
      reward: win?{cash:4000}:{happiness:-3},penalty:{},status:"pending"});
    addLog("🎲 Gamble placed. Result in 60 seconds.");
  }
  addLog(c.res);currentEvent=null;closeModal();save();renderGame();toast(c.res);
  showCharacter('avatar', c.res, 4000);
};

/* ---------------- MODAL ---------------- */
function openModal(html){document.body.classList.add("mo");
  $modal.innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`;
}
window.closeModal=function(){$modal.innerHTML="";document.body.classList.remove("mo");};

/* ---------------- TICK ---------------- */
setInterval(()=>{
  if(!S)return;
  if(checkAppts())renderGame();regen();
  const now=Date.now();
  document.querySelectorAll("[data-cd]").forEach(el=>{
    const a=S.appointments.find(x=>x.id===el.getAttribute("data-cd"));
    if(!a)return;
    if(a.status==="pending")el.textContent=fmtDur(a.unlockAt-now);
    else if(a.status==="ready")el.textContent=fmtDur(a.expiresAt-now);
  });
},1000);

/* ---------------- V15: PROGRESSIVE UNLOCKS ---------------- */
const needCh=n=>()=>(S.chap||0)>=n;
const UNL={assets:{ok:()=>S.level>=2,t:()=>"Reach Level 2"},owambe:{ok:()=>S.level>=3,t:()=>"Reach Level 3"},biz:{ok:needCh(4),n:4},stocks:{ok:needCh(4),n:4},forex:{ok:needCh(6),n:6}};
const unl=k=>{try{return UNL[k].ok();}catch(e){return true;}};
const lockMsg=k=>{const u=UNL[k];return "🔒 Locked. "+(u.t?u.t():"Finish the chapter: "+(CHAPTERS[u.n-1]||{t:""}).t);};
const UNAME={assets:"Assets",owambe:"Owambe",biz:"Empire",stocks:"Stock Market",forex:"Forex"};
function unlockCheck(){if(!S||!S.assets)return;if(!S.unl){S.unl={};Object.keys(UNL).forEach(k=>{if(unl(k))S.unl[k]=1;});return;}Object.keys(UNL).forEach(k=>{if(unl(k)&&!S.unl[k]){S.unl[k]=1;addLog("🔓 Unlocked: "+UNAME[k]);toast("🔓 Unlocked: "+UNAME[k]+"!");burst();sfx(2);track('unlock_'+k);}});}
[["openAssets","assets"],["openOwambe","owambe"],["openBiz","biz"],["openStocks","stocks"],["openMarket","forex"]].forEach(([n,k])=>{const f=window[n];window[n]=function(){if(!unl(k))return toast(lockMsg(k));return f.apply(this,arguments);};});

/* ---------------- V16: DAILY HUB ---------------- */
const tdy=()=>new Date().toDateString();
function owReady(){return unl('owambe')&&(Date.now()-(S.lastOwambe||0))/HOUR>=24;}
function dailyTodo(){const t=tdy();let n=0;if(S.spinDay!==t)n++;if(S.ajo.lastPaid!==t)n++;if(S.vaultDay!==t)n++;if(owReady())n++;if(S.appointments.some(a=>a.status==="ready"))n++;return n;}
function dailyBonus(){const t=tdy();if(!S||!S.ajo||S.dbDay===t||S.vaultDay!==t||S.ajo.lastPaid!==t||S.spinDay!==t)return;S.dbDay=t;S.cash+=1500;addXp(30);addLog("🎯 Daily habits complete! +₦1,500");toast("🎯 Daily habits complete! +₦1,500");burst();sfx(3);track('daily_complete');}
window.dyAjo=function(){doAjo();openDaily();};
window.dySave=function(){vaultMove(2000);openDaily();};
window.openDaily=function(){const t=tdy(),m=getMissions(),rd=S.appointments.filter(a=>a.status==="ready").length,pend=S.appointments.filter(a=>a.status==="pending").length;
  const vd=S.vaultDay===t,ad=S.ajo.lastPaid===t,sd=S.spinDay===t,done=[vd,ad,sd].filter(Boolean).length;
  const bt=(l,f,c)=>`<button class="btn ${c===undefined?"primary":c}" style="padding:8px 12px;font-size:12px;white-space:nowrap" onclick="${f}">${l}</button>`;
  const card=(ic,ti,sub,dn,btn)=>`<div class="opt" style="${dn?"border-color:var(--green);opacity:.75":""}"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><div><b>${ic} ${ti}</b> ${dn?"✅":""}<span class="sub">${sub}</span></div>${dn?"":btn}</div></div>`;
  const hrs=Math.max(0,Math.ceil(24-(Date.now()-(S.lastOwambe||0))/HOUR));
  openModal(`<h3>📅 Today</h3><div class="opt" style="border-color:var(--gold)"><b>🎯 Daily habits: ${done}/3</b><span class="sub">${S.dbDay===t?"Bonus claimed today ✅":"Do all 3 for a ₦1,500 bonus: save, Ajo, and spin."}</span><div class="bar"><i style="width:${Math.round(done/3*100)}%;background:linear-gradient(90deg,#2fbf86,#e9b949)"></i></div></div>`+
  card("🛡️","Pay yourself first",`Save ₦2,000 in your Vault. Saving streak: ${S.habit||0} days.`,vd,bt("Save ₦2k","dySave()"))+
  card("🪙","Ajo savings",`₦500 today. Streak ${S.ajo.streak}/7, ₦5,000 payout on day 7.`,ad,bt("Pay ₦500","dyAjo()","warn"))+
  card("🎰","Lucky spin","One free reward every day.",sd,bt("Spin","openSpin()","warn"))+
  (unl("owambe")?card("🎉","Owambe",owReady()?"Meet big people and grow your network.":`Resting. Back in about ${hrs}h.`,!owReady(),bt("Attend","openOwambe()","")):`<div class="opt lck"><b>🎉 Owambe</b><span class="sub">${lockMsg("owambe")}</span></div>`)+
  card("📋","Daily quests",`Work ${Math.min(m.work,3)}/3 · Travel ${Math.min(m.travel,2)}/2 · Social ${Math.min(m.social,1)}/1 (Ajo or Owambe). Reward ₦5,000 and full energy.`,!!m.claimed,"")+
  (rd||pend?card("📅","Appointments",`${rd} ready · ${pend} waiting`,false,bt("View","openAppts()","")):"")+
  `<div class="rw" style="color:var(--muted)">🔥 Login streak: day ${S.streak||1}. Tomorrow: ₦${fmtMoney(STREAK[(S.streak||1)%7])}</div><button class="opt" onclick="closeModal();renderGame()" style="text-align:center">Close</button>`);};

render();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW registration failed', err));
  });
}
