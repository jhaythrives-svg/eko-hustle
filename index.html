<title>Eko Hustle</title>
<style>
  :root{--bg:#0b0f0e;--card:#141a18;--card2:#1b231f;--line:#26302b;

    padding:6px 10px;border-radius:999px;border:1px solid var(--line)}
  .level-bar{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:12px}
  .level-top{display:flex;justify-content:space-between;font-size:12px;font-weight:600;margin-bottom:6px}
  .xp-bar{height:6px;background:#0a1f12;border-radius:999px;overflow:hidden}

  .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  .stat .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .stat .v{font-size:18px;font-weight:700;margin-top:2px}
  .bar{height:8px;background:#0a1f12;border-radius:999px;overflow:hidden;margin-top:6px}
  .bar > i{display:block;height:100%;background:linear-gradient(90deg,#16a34a,#22c55e);width:0%;transition:width .3s}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 14px}
  .chip{background:var(--card);border:1px solid var(--line);border-radius:999px;
    padding:6px 10px;font-size:12px;color:var(--muted)}
  .chip b{color:var(--text);margin-left:4px}
  .loc{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:14px;margin-bottom:12px}
  .loc .name{font-size:18px;font-weight:700}
  .loc .desc{font-size:13px;color:var(--muted);margin-top:2px}
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
  button{font-family:inherit}
  .btn{background:var(--card2);border:1px solid var(--line);color:var(--text);
    padding:14px 12px;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:8px;

  .btn.warn{background:linear-gradient(135deg,#b45309,#f59e0b);border:none;color:#1a0f00}
  .btn.asset{background:linear-gradient(135deg,#1e3a8a,#3b82f6);border:none;color:#eff6ff}
  .btn.owambe{background:linear-gradient(135deg,#8b5cf6,#d946ef);border:none;color:#fff;grid-column:span 2;}
  .btn.vip{background:linear-gradient(135deg,#fbbf24,#d97706);border:none;color:#451a03;grid-column:span 2;}
  .btn.share{background:linear-gradient(135deg,#25D366,#128C7E);border:none;color:#fff;width:100%;font-size:16px;margin-top:10px;}
  .btn.invite{background:linear-gradient(135deg,#f59e0b,#d97706);border:none;color:#fff;width:100%;font-size:14px;margin-top:8px;}
  .btn.skill{background:linear-gradient(135deg,#2563eb,#3b82f6);border:none;color:#fff;}
  .section-title{font-size:12px;color:var(--muted);text-transform:uppercase;

  .appt.missed{opacity:.5;border-color:var(--red)}
  .appt .t{font-weight:700;font-size:15px}
  .appt .d{font-size:13px;color:var(--muted);margin-top:3px}
  .appt .meta{font-size:12px;margin-top:8px;color:var(--amber);font-weight:600}
  .appt .go{margin-top:10px}
  .log{font-size:12px;color:var(--muted);line-height:1.6}
  .log div{padding:4px 0;border-bottom:1px dashed #1e2722}
  .feed{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:10px 12px;font-size:12px;color:var(--amber);margin-bottom:12px;
    display:flex;align-items:center;gap:8px;overflow:hidden}

  @keyframes slide { from { transform: translateX(100%); } to { transform: translateX(-100%); } }
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;
    align-items:flex-end;justify-content:center;z-index:50;padding:0}
  .modal{background:var(--card);border:1px solid var(--line);
    border-radius:18px 18px 0 0;width:100%;max-width:480px;padding:18px 16px 24px;
    max-height:85vh;overflow:auto;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
  .modal h3{font-size:16px;margin-bottom:10px}
  .opt{display:block;width:100%;text-align:left;background:var(--card2);
    border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;

  .opt .sub{display:block;font-size:12px;color:var(--muted);margin-top:3px}

  .rank{display:flex;align-items:center;gap:10px;padding:10px 12px;
    background:var(--card2);border:1px solid var(--line);border-radius:12px;margin-bottom:6px}
  .rank .n{width:24px;font-weight:700;color:var(--amber);text-align:center}
  .rank .info{flex:1}
  .rank .h{font-weight:600}
  .rank .m{font-size:12px;color:var(--muted);margin-top:2px}

  .onb .hero span{color:var(--green)}

    border-radius:12px;padding:14px;color:var(--text);font-size:16px;outline:none}
  .field input:focus{border-color:var(--green)}
  .pick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .pick .opt{margin:0;text-align:center;padding:14px 10px}
  .pick .opt.sel{border-color:var(--green);background:#0f2016}
  .reset{font-size:11px;color:#5b6b63;text-align:center;margin-top:24px;
    background:none;border:none;cursor:pointer;text-decoration:underline}
  .sync{font-size:10px;color:var(--muted);text-align:center;margin-top:8px;min-height:14px}
  .legal{font-size:11px;color:#6b7c73;text-align:center;margin-top:12px;line-height:1.5}
  .legal a{color:var(--green);text-decoration:none}
  .code-box{background:#0b0f0e;border:1px solid #26302b;border-radius:10px;padding:12px;
    font-family:monospace;font-size:14px;word-break:break-all;margin-bottom:12px;text-align:center;letter-spacing:2px}
  .profile-header{text-align:center;margin-bottom:16px}
  .profile-name{font-size:24px;font-weight:800}
  .profile-dream{color:var(--amber);font-size:14px;font-weight:600;margin-top:4px}
  .asset-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
  .asset-card{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
  .asset-card .emoji{font-size:24px}
  .asset-card .name{font-size:12px;font-weight:600;margin-top:4px}
  .mission{display:flex;justify-content:space-between;align-items:center;
    background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}

  .mission .m-title{font-weight:600;font-size:14px}
  .mission .m-desc{font-size:12px;color:var(--muted);margin-top:2px}
  .mission .m-check{font-size:20px}
  .skill-row{display:flex;justify-content:space-between;align-items:center;
    background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
  .skill-info{flex:1}
  .skill-name{font-weight:700;font-size:14px;color:var(--blue)}
  .skill-desc{font-size:12px;color:var(--muted);margin-top:2px}
  .skill-lvl{font-size:16px;font-weight:800;color:var(--green);margin-right:12px}

  .float{position:fixed;top:40%;font-weight:800;font-size:22px;pointer-events:none;z-index:120;animation:fl 1.1s ease-out forwards;text-shadow:0 2px 8px #000}
  @keyframes fl{to{transform:translateY(-90px);opacity:0}}
  .conf{position:fixed;font-style:normal;font-size:20px;pointer-events:none;z-index:120;animation:cf 1.3s ease-out forwards}
  @keyframes cf{to{transform:translate(var(--x),var(--y)) rotate(360deg);opacity:0}}
  .rival{background:var(--card);border:1px solid #4a2a2a;border-radius:12px;padding:10px 12px;margin-bottom:12px}
  .rv-top{display:flex;justify-content:space-between;font-size:13px}
  .rv-sub{font-size:11px;color:var(--muted);margin-top:6px}
  .sgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:10px 0}
  .sd{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:6px 2px;font-size:10px;text-align:center;color:var(--muted)}
  .sd b{display:block;color:var(--text);font-size:10px;margin-top:2px}
  .sd.got{opacity:.5;border-color:var(--green)}
  .sd.now{border-color:var(--gold);background:#2a2010;animation:pl 1s infinite alternate}
  @keyframes pl{to{box-shadow:0 0 12px var(--gold)}}
  .rw{text-align:center;font-size:13px;color:#c8d6ce;margin:8px 0}
  .spin{font-size:26px;font-weight:800;text-align:center;padding:28px 8px;background:var(--card2);border:2px dashed var(--line);border-radius:14px;margin:12px 0}
  .spin.win{border-color:var(--gold);color:var(--gold);animation:pl .5s 3 alternate}
  .pulse{animation:pl .8s infinite alternate}

  /* VISUAL NOVEL ELEMENTS */
  .visual-area {
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    height: 200px; margin-top: 10px; margin-bottom: 10px; position: relative;
  }
  .character-img {
    max-height: 180px; max-width: 100%; object-fit: contain;
    animation: fadeIn 0.4s ease-out; z-index: 1;
  }
  .dialogue-box {
    background: rgba(0, 0, 0, 0.85); border: 1px solid var(--line); border-left: 4px solid var(--green);
    border-radius: 8px; padding: 12px; width: 100%; min-height: 60px;
    z-index: 2; margin-top: -10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
  }
  .dialogue-name {
    color: var(--green); font-size: 11px; font-weight: 800; text-transform: uppercase;
    letter-spacing: 1px; margin-bottom: 4px; display: block;
  }
  .dialogue-text {
    font-size: 14px; font-weight: 600; line-height: 1.4; color: #fff;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .tbar{position:relative;height:34px;background:var(--card2);border:1px solid var(--line);border-radius:999px;margin:14px 0;overflow:hidden}
  .tz{position:absolute;left:33%;width:34%;top:0;bottom:0;background:rgba(34,197,94,.28)}
  .tz:after{content:"";position:absolute;left:29.4%;width:41%;top:0;bottom:0;background:rgba(251,191,36,.6)}
  .tm{position:absolute;top:0;bottom:0;width:6px;background:#fff;border-radius:3px;transform:translateX(-50%)}
  /* V4 ANIMATED SCENE */
  .scene{position:relative;height:190px;border-radius:14px;overflow:hidden;border:1px solid var(--line);margin-bottom:6px;transition:background 1s}
  .scene.rainy{filter:brightness(.78) saturate(.85)}
  .celest{position:absolute;font-size:30px;z-index:1;animation:bob 4s ease-in-out infinite}
  .star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;animation:tw 2s ease-in-out infinite alternate}
  @keyframes tw{to{opacity:.2}}
  .sk{position:absolute;left:0;width:200%;display:flex;z-index:2;animation:scr 70s linear infinite}
  .sk svg{width:50%;height:auto;display:block}
  .sk1{bottom:44px;opacity:.9}.sk2{bottom:38px;z-index:3;animation-duration:32s}
  @keyframes scr{to{transform:translateX(-50%)}}
  .ground{position:absolute;left:0;right:0;bottom:0;height:50px;background:linear-gradient(#3a3f44,#1a1d20);z-index:4}
  .ground:after{content:"";position:absolute;left:0;right:0;bottom:12px;height:3px;background:repeating-linear-gradient(90deg,#f5d76e 0 22px,transparent 22px 48px);background-size:48px 3px;animation:lane 1s linear infinite;opacity:.7}
  @keyframes lane{to{background-position:-48px 0}}
  .veh{position:absolute;font-size:34px;z-index:4;white-space:nowrap}
  @keyframes drive{from{left:-15%}to{left:110%}}
  @keyframes driveL{from{left:110%}to{left:-15%}}
  .prop{position:absolute;left:46%;bottom:44px;font-size:40px;z-index:3;filter:drop-shadow(0 2px 4px #000)}
  .av{position:absolute;left:14%;bottom:20px;z-index:6;animation:bob 2.4s ease-in-out infinite}
  .av img{height:96px;display:block}.av b{font-size:72px;line-height:1;display:block}
  .npc{position:absolute;left:66%;bottom:20px;z-index:5}
  .npc img{height:96px;display:block}.npc b{font-size:72px;line-height:1;display:block}
  .bubble{position:absolute;top:-20px;left:50%;transform:translateX(-50%);background:#fff;color:#000;border-radius:10px;padding:0 7px;font-size:14px;z-index:7;animation:bob 1s ease-in-out infinite}
  .locname{position:absolute;left:10px;top:8px;z-index:8;background:rgba(0,0,0,.5);padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700}
  .rain{position:absolute;inset:0;z-index:7;opacity:.5;pointer-events:none;background:repeating-linear-gradient(105deg,rgba(255,255,255,.5) 0 1px,transparent 1px 10px);background-size:20px 40px;animation:rn .35s linear infinite}
  @keyframes rn{to{background-position:-20px 40px}}
  .scene.work .av{animation:wk .35s ease-in-out 4}
  @keyframes wk{0%,100%{transform:rotate(0)}30%{transform:rotate(-10deg) translateY(-8px)}70%{transform:rotate(8deg) translateY(-3px)}}
  .scene.arrive .av{animation:runin 1s ease-out}
  @keyframes runin{from{transform:translateX(-170px) skewX(-10deg)}to{transform:none}}
  .scene.arrive .sk{animation-duration:2.5s}
  .coin{position:absolute;bottom:110px;font-style:normal;font-size:22px;z-index:9;animation:cn 1.1s ease-out both}
  @keyframes cn{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-80px) rotate(45deg)}}
  .visual-area{height:auto;flex-direction:row;align-items:center;gap:10px;margin:8px 0}
  .character-img{max-height:64px;width:64px;border-radius:50%;border:2px solid var(--line);object-fit:cover}
  .char-em{font-size:44px;animation:none}
  .dialogue-box{margin-top:0}
</style>
</head>

/* ---------------- HELPERS ---------------- */
function load(){try{const r=localStorage.getItem(KEY);return r?JSON.parse(r):null;}catch(e){return null;}}
function clamp(v,lo=0,hi=100){return Math.max(lo,Math.min(hi,v));}
function fmtMoney(n){return Math.max(0,Math.round(n)).toLocaleString("en-NG");}
function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function cleanName(n){return String(n||"").replace(/[\x00-\x1F\x7F]/g,"").trim().slice(0,20);}
function fmtDur(ms){
  if(ms<=0)return"0s";
  const s=Math.floor(ms/1000);
  if(s<60)return s+"s";
  const m=Math.floor(s/60);
  if(m<60)return m+"m "+(s%60)+"s";
  const h=Math.floor(m/60);
  if(h<24)return h+"h "+(m%60)+"m";
  return Math.floor(h/24)+"d "+(h%24)+"h";
}
function toast(msg){
  $toast.textContent=msg;$toast.classList.add("show");
  clearTimeout(toast._t);toast._t=setTimeout(()=>$toast.classList.remove("show"),2200);
}
function addLog(t){S.log.unshift({t:Date.now(),text:t});if(S.log.length>30)S.log.length=30;}
function applyFx(fx){
  if(!fx)return;
  for(const k in fx){
    if(k==="cash")S.cash+=fx[k];
    else if(k==="health")S.health=clamp(S.health+fx[k]);
    else if(k==="happiness")S.happiness=clamp(S.happiness+fx[k]);
    else if(k==="reputation")S.reputation=Math.max(0,S.reputation+fx[k]);
    else if(k==="network")S.network=Math.max(0,S.network+fx[k]);
    else if(k==="energy")S.energy=clamp(S.energy+fx[k],0,S.maxEnergy);
    else if(k==="maxEnergy")S.maxEnergy=Math.max(100, S.maxEnergy+fx[k]);
  }
}

/* ---------------- MISSIONS ---------------- */
function getMissions() {
  const today = new Date().toDateString();
  if (!S.missions || S.missions.date !== today) {
    S.missions = { date: today, work: 0, travel: 0, social: 0, claimed: false };
  }
  return S.missions;
}

function updateMission(type) {
  const m = getMissions();
  if (m.claimed) return;
  if (type === 'work') m.work++;
  if (type === 'travel') m.travel++;
  if (type === 'social') m.social++;
  
  if (m.work >= 3 && m.travel >= 2 && m.social >= 1 && !m.claimed) {
    m.claimed = true;
    S.cash += 5000;
    S.energy = S.maxEnergy;
    addXp(100); // Bonus XP for completing all missions
    addLog("🏆 Daily Missions Completed! +₦5,000, Full Energy, +100 XP.");
    toast("🏆 Missions Complete! +₦5,000");
    postToFeed(`${esc(S.name)} completed all daily missions! 🏆`);
    showCharacter('avatar', "You crushed all your missions today! Lagos is yours.", 5000);
  }
  save();
}

/* ---------------- RPG: LEVELS & SKILLS ---------------- */
function addXp(amount) {
  S.xp = (S.xp || 0) + amount;
  const nextLevelXp = S.level * 100;
  if (S.xp >= nextLevelXp) {
    S.xp -= nextLevelXp;
    S.level++;
    S.skillPoints = (S.skillPoints || 0) + 1;burst();sfx(3);buzz([40,30,80]);
    toast(`⭐ LEVEL UP! You are now Level ${S.level}! +1 Skill Point.`);
    addLog(`⭐ Leveled up to Level ${S.level}! Got 1 Skill Point.`);
    showCharacter('avatar', `Level Up! You are now Level ${S.level}. You feel stronger.`, 4000);
  }
}

/* ---------------- AUTH ---------------- */
async function ensureAuth(){
  if(!sb) return null;
  if(session?.user)return session;
  const { data:{ session:s1 } } = await sb.auth.getSession();
  if(s1?.user){session=s1;return s1;}
  const { data, error } = await sb.auth.signInAnonymously();
  if(error){authError=error.message;return null;}
  session=data.session;
  return session;
}

function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function save(){
  if(S){try{checkAch();}catch(e){}S.lastSaved=Date.now();}
  saveLocal();
  scheduleCloudSync();
}
function scheduleCloudSync(){
  if(!S||!session?.user||!sb)return;
  clearTimeout(cloudTimer);
  cloudTimer=setTimeout(cloudPush,1500);
}
async function cloudPush(){
  if(!S||!session?.user||!sb)return;
  syncStatus="syncing";
  try{
    const { error } = await sb.from("saves").upsert({
      user_id: session.user.id,
      handle: cleanName(S.name),
      state: S
    }, { onConflict: "user_id" });
    syncStatus = error ? (String(error.message).includes("Too many") ? "ratelimited" : "error") : "synced";
  }catch(e){syncStatus="offline";}
}
async function cloudPull(){
  if(!session?.user||!sb)return null;
  try{
    const { data, error } = await sb.from("saves")
      .select("state,updated_at").eq("user_id", session.user.id).maybeSingle();
    if(error||!data)return null;
    return data;
  }catch(e){return null;}
}

/* ---------------- DAILY RESET ---------------- */
function checkReset(){
  if(!S)return;
  const now=Date.now();
  if(now-S.lastReset>=DAY){
    const days=Math.floor((now-S.lastReset)/DAY);
    S.day+=days;S.lastReset=now;S.energy=S.maxEnergy;
    
    let rentEarned = 0;
    if (S.assets) {
      S.assets.forEach(id => {
        const asset = ASSETS.find(a => a.id === id);
        if (asset && asset.rent) rentEarned += asset.rent * days;
      });
    }
    
    const upkeep=1500*Math.max(0,Math.min(days,Math.max(0,S.day-3-(Math.max(0,S.day-days-3)))));
    
    if (rentEarned > 0) {
      S.cash += rentEarned;
      addLog(`🏠 Collected ₦${fmtMoney(rentEarned)} in rent from your properties.`);
    }
    
    if(upkeep>0){
      if(S.cash>=upkeep){S.cash-=upkeep;addLog(`Day ${S.day}. Upkeep ₦${fmtMoney(upkeep)} paid.`);}
      else{
        const short=upkeep-S.cash;S.cash=0;
        S.health=clamp(S.health-15*days);S.happiness=clamp(S.happiness-15*days);
        addLog(`Day ${S.day}. Couldn't pay ₦${fmtMoney(short)} upkeep.`);
      }
    }else addLog(`Day ${S.day}. Grace period \u2014 no upkeep yet.`);
    save();
  }
}

  return changed;
}

function sceneHtml(){

  if(!S.vipUntil) S.vipUntil = 0;
  if(!S.lastOwambe) S.lastOwambe = 0;
  if(!S.missions) S.missions = { date: new Date().toDateString(), work: 0, travel: 0, social: 0, claimed: false };

async function fetchFeed() {
  const $feedText = document.getElementById("feed-text");
  if(!$feedText || !sb) return;
  try {
    const { data } = await sb.from('public_events').select('message').order('created_at', {ascending: false}).limit(5);
    if (data && data.length > 0) {
      const messages = data.map(d => d.message).join('  •  ');
      $feedText.textContent = messages;
    } else {
      $feedText.textContent = "Quiet in Lagos today... Start a hustle to make news!";
    }
  } catch(e) {}
}

async function postToFeed(msg) {
  if(!sb || !session?.user) return;
  try { await sb.from('public_events').insert({ message: msg }); } catch(e) {}
}

function apptCard(a,now){
  let meta="";
  if(a.status==="pending")meta=`⏳ Unlocks in <span data-cd="${a.id}">${fmtDur(a.unlockAt-now)}</span>`;
  else if(a.status==="ready")meta=`🔥 Ready at ${LOCS[a.loc].name} — expires in <span data-cd="${a.id}">${fmtDur(a.expiresAt-now)}</span>`;
  else if(a.status==="missed")meta="❌ Missed";
  const claimable=a.status==="ready"&&S.location===a.loc;
  return `<div class="appt ${a.status}">
    <div class="t">${esc(a.title)}</div><div class="d">${esc(a.desc)}</div>
    <div class="meta">${meta}</div>
    ${claimable?`<button class="btn primary go" onclick="claimAppt('${a.id}')">Claim reward</button>`:""}
  </div>`;
}

window.doWorkCore=function(jobId){
  const job=(JOBS[S.location]||[]).find(j=>j.id===jobId);
  if(!job)return;
  
  const hustleDiscount = 1 - ((S.skills?.hustle || 0) * 0.05);
  const actualEnergyCost = Math.ceil(job.energy * hustleDiscount);
  
  if(S.energy < actualEnergyCost) return toast(`Not enough energy (needs ${actualEnergyCost}). Rest first.`);
  
  let pay=rand(job.pay[0],job.pay[1]);const cb=hustleCombo();pay=Math.floor(pay*cb*(window._perf||1));window._perf=1;
  const isVip = S.vipUntil > Date.now();
  const businessMult = 1 + ((S.skills?.business || 0) * 0.10);
  
  if(isVip) pay = pay * 2;
  pay = Math.floor(pay * businessMult);
  
  S.energy -= actualEnergyCost;
  S.cash += pay;floatText("+₦"+fmtMoney(pay));sfx(1);buzz(15);
  applyFx(job.fx);
  addXp(job.xp || 10);
  
  S.flags.workCount=(S.flags.workCount||0)+1;
  addLog(`Worked: ${job.name}. +₦${fmtMoney(pay)}${isVip ? " (VIP)" : ""}. +${job.xp||10} XP.`);
  
  updateMission('work');
  
  if(!S.flags.firstGigDone){
    S.flags.firstGigDone=true;
    scheduleAppt({id:"tunde_"+Date.now(),title:"Tunde: Come to Yaba",
      desc:"Tunde says he has a big gig for you. Don't be late.",loc:"yaba",
      unlockAt:Date.now()+90000,expiresAt:Date.now()+90000+DAY,
      reward:{cash:8000,reputation:5,network:3},penalty:{happiness:-10},status:"pending"});
    addLog("📅 New appointment: Tunde in Yaba.");
    showCharacter('tunde', "Guy! You get mind. Come to Yaba tomorrow, I get a big gig for you. Don't be late.", 6000);
  }
  if(S.flags.workCount===3&&!S.flags.mysteryScheduled){
    S.flags.mysteryScheduled=true;
    scheduleAppt({id:"mystery_"+Date.now(),title:"Unknown caller",
      desc:"Someone says they have news for you. They'll reach out soon.",loc:S.location,
      unlockAt:Date.now()+4*HOUR,expiresAt:Date.now()+4*HOUR+DAY,
      reward:{cash:rand(2000,6000)},penalty:{happiness:-5},status:"pending"});
    addLog("📞 A mystery caller will reach you soon.");
  }
  save();closeModal();
  if(Math.random()<0.35){renderGame();triggerEvent();}
  else{renderGame();toast(`+₦${fmtMoney(pay)} • +${job.xp||10} XP${S.combo>0?` • 🔥 x${cb.toFixed(1)} combo`:""}`);}
};

window.openSettings=function(){
  openModal(`<h3>⚙️ Settings</h3>
    <button class="opt" onclick="S.mute=!S.mute;save();openSettings()">${S.mute?"🔇 Sound: Off":"🔊 Sound: On"}</button>
    <button class="opt" onclick="showPrivacy()">Privacy notice</button>
    <button class="opt" onclick="deleteMyData()" style="color:#fca5a5">Delete all my data</button>
    <button class="opt" onclick="closeModal()">Close</button>`);
};
window.showPrivacy=function(){
  openModal(`<h3>Privacy</h3>
    <div style="color:#c8d6ce;font-size:13px;line-height:1.6">
      <p><b>What we store:</b> an anonymous account (random ID), the display name you type, and your game save.</p>
      <p><b>What we never collect:</b> real name, email, phone, location, contacts, photos.</p>
      <p><b>Where:</b> Supabase (Postgres, EU/US). Encrypted in transit.</p>
      <p><b>Who can see it:</b> only you. Leaderboard shows display name, cash, reputation, day. No IDs.</p>
      <p><b>Delete:</b> Settings → Delete all my data. Immediate and permanent.</p>
      <p><b>Retention:</b> inactive saves over 90 days are deleted.</p>
      <p style="color:#8fa39a;font-size:12px;margin-top:12px">NDPR-aligned. Questions: reply on our WhatsApp Channel.</p>
    </div>
    <button class="opt" onclick="closeModal()">Close</button>`);
};
window.deleteMyData=async function(){
  if(!session?.user||!sb)return;
  if(!confirm("Delete your save and account? This cannot be undone."))return;
  try{
    await sb.from("subscriptions").delete().eq("user_id", session.user.id);
    await sb.from("link_tokens").delete().eq("user_id", session.user.id);
    await sb.from("saves").delete().eq("user_id", session.user.id);
    await sb.auth.signOut();
  }catch(e){}
  localStorage.removeItem(KEY);
  S=null;session=null;closeModal();
  toast("Data deleted.");
  location.reload();
};

/* ---------------- EVENTS ---------------- */
function triggerEvent(){
  renderGame();
  const ev=EVENTS[Math.floor(Math.random()*EVENTS.length)];
  currentEvent=ev;
  const html=ev.choices.map((c,i)=>`<button class="opt" onclick="pickChoice(${i})">${esc(c.label)}</button>`).join("");
  showCharacter('avatar', ev.text, 0);
  openModal(`<h3>${esc(ev.title)}</h3><p style="color:#c8d6ce;font-size:14px;margin:0 0 12px">${esc(ev.text)}</p>${html}`);
}

window.pickChoice=function(i){
  if(!currentEvent)return;
  const c=currentEvent.choices[i];
  applyFx(c.fx);
  if(c.tag==="mystery"){
    const win=Math.random()<0.5;
    scheduleAppt({id:"myst_"+Date.now(),
      title: win?"🎲 Your gamble paid off":"🎲 Your gamble failed",
      desc: win?"The bet landed. Come collect.":"The bet didn't land. Lesson learned.",
      loc:S.location,unlockAt:Date.now()+60000,expiresAt:Date.now()+DAY,
      reward: win?{cash:4000}:{happiness:-3},penalty:{},status:"pending"});
    addLog("🎲 Gamble placed. Result in 60 seconds.");
  }
  addLog(c.res);currentEvent=null;closeModal();save();renderGame();toast(c.res);
  showCharacter('avatar', c.res, 4000);
};

/* ---------------- MODAL ---------------- */
function openModal(html){
  $modal.innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`;
}
window.closeModal=function(){$modal.innerHTML="";};

/* ---------------- TICK ---------------- */
setInterval(()=>{
  if(!S)return;
  if(checkAppts())renderGame();regen();
  const now=Date.now();
  document.querySelectorAll("[data-cd]").forEach(el=>{
    const a=S.appointments.find(x=>x.id===el.getAttribute("data-cd"));
    if(!a)return;
    if(a.status==="pending")el.textContent=fmtDur(a.unlockAt-now);
    else if(a.status==="ready")el.textContent=fmtDur(a.expiresAt-now);
  });
},1000);

render();

// Register Service Worker for offline support
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW registration failed', err));
  });
}
</script>
